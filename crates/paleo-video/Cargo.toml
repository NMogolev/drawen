[package]
name = "paleo-video"
description = "Codec selection for Paleo video playback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[features]
default = ["h264", "hevc", "vp9", "av1"]
h264 = ["dep:paleo-h264"]
hevc = ["dep:paleo-hevc"]
vp9 = ["dep:paleo-vp9"]
av1 = ["dep:paleo-av1"]

[dependencies]
paleo = { version = "0.2", path = "../paleo" }
paleo-av1 = { version = "0.2", path = "../paleo-av1", optional = true }
paleo-h264 = { version = "0.2", path = "../paleo-h264", optional = true }
paleo-hevc = { version = "0.2", path = "../paleo-hevc", optional = true }
paleo-vp9 = { version = "0.2", path = "../paleo-vp9", optional = true }
