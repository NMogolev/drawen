[package]
name = "paleo-av1"
description = "Pure-Rust AV1 decoding backend for Paleo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
paleo = { version = "0.2", path = "../paleo" }
# Pin the decoder exactly: its streaming API is young and the packet bridge in
# this crate is written against this release. The `asm` feature is off, so this
# build path is pure Rust; the maintained assembly kernels need NASM.
rusty_av1d = { version = "=1.3.0", default-features = false, features = [
    "bitdepth_8",
    "bitdepth_16",
] }
