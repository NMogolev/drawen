[package]
name = "drawen-agent"
description = "Graphics-free observation and control of a Drawen UI for LLM agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["gui", "ui", "agent", "accessibility", "llm"]
categories = ["gui", "accessibility"]

[lints]
workspace = true

[features]
default = ["json"]
# JSON snapshots and commands for machine consumers.
json = ["dep:serde", "dep:serde_json"]
# Local TCP bridge: an external agent process observes and acts over JSON lines.
serve = ["json", "dep:drawen-tasks"]

[dependencies]
drawen-core = { version = "0.4", path = "../drawen-core" }
drawen-ui = { version = "0.4", path = "../drawen-ui" }
drawen-tasks = { version = "0.4", path = "../drawen-tasks", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.149", optional = true }

[dev-dependencies]
drawen = { version = "0.4", path = "../drawen", default-features = false, features = ["agent-serve"] }
drawen-platform-winit = { version = "0.4", path = "../drawen-platform-winit" }
serde_json = "1.0.149"

[[example]]
name = "headless_agent"
required-features = ["serve"]

[[example]]
name = "agent_window"
required-features = ["serve"]
