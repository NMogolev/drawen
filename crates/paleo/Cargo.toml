[package]
name = "paleo"
description = "Drawen's pure-Rust media layer built from focused container, audio, and video crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[features]
default = ["opus"]
# Decodes Ogg/Matroska/MP4 Opus through the pure-Rust `symphonia-opus` backend.
opus = ["dep:symphonia-opus"]

[dependencies]
symphonia = { version = "0.6.1", default-features = false, features = [
    "all-codecs",
    "all-formats",
    "opt-simd",
] }
symphonia-opus = { version = "0.1.3", optional = true }
