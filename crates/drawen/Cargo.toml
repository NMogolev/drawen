[package]
name = "drawen"
description = "Public facade for the Drawen UI toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["gui", "ui", "widgets", "desktop", "retained-mode"]
categories = ["gui", "rendering", "multimedia"]

[lints]
workspace = true

[features]
# The default set keeps every renderer and widget available. Applications that
# only need the headless core can use `--no-default-features` to drop `wgpu`,
# Servo interop, and the Paleo media stack from the dependency graph.
default = ["gpu", "browser", "media", "cubex"]
# Enables the `wgpu` display-list renderer and `drawen::gpu`.
gpu = ["dep:drawen-wgpu"]
# Enables Servo browser surfaces and `drawen::browser`. Requires the GPU
# renderer because browser frames are composited through `wgpu`.
browser = ["dep:drawen-browser", "gpu"]
# Enables CubeXView and the `drawen::cubex` module.
cubex = ["dep:cubex", "drawen-widgets/cubex"]
# Enables Video, AnimatedImage, PaleoSession, and the shared media contracts.
media = ["drawen-widgets/media"]
# Enables audio-mastered Paleo playback through the cpal output backend.
audio = ["media", "drawen-widgets/audio"]
# Enables the optional media director runtime.
director = ["dep:drawen-director", "media"]
# Enables the LLM agent bridge and `drawen::agent`.
agent = ["dep:drawen-agent"]
# Enables the loopback TCP server in the agent bridge.
agent-serve = ["agent", "drawen-agent/serve"]

[dependencies]
cubex = { version = "0.3", path = "../cubex", optional = true }
drawen-agent = { version = "0.3", path = "../drawen-agent", optional = true }
drawen-browser = { version = "0.3", path = "../drawen-browser", optional = true }
drawen-core = { version = "0.3", path = "../drawen-core" }
drawen-director = { version = "0.3", path = "../drawen-director", optional = true }
drawen-render = { version = "0.3", path = "../drawen-render" }
drawen-software = { version = "0.3", path = "../drawen-software" }
drawen-wgpu = { version = "0.3", path = "../drawen-wgpu", optional = true }
drawen-platform = { version = "0.3", path = "../drawen-platform" }
drawen-tasks = { version = "0.3", path = "../drawen-tasks" }
drawen-ui = { version = "0.3", path = "../drawen-ui" }
drawen-widgets = { version = "0.3", path = "../drawen-widgets", default-features = false }
drawen-workspace = { version = "0.3", path = "../drawen-workspace" }

[dev-dependencies]
drawen-platform-winit = { version = "0.3", path = "../drawen-platform-winit" }
rfd = "0.15"
