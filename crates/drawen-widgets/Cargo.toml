[package]
name = "drawen-widgets"
description = "Standard widgets for Drawen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[features]
# A direct dependency stays lean by default. The `drawen` facade enables
# `media` from its own default feature set so applications keep Video available.
default = []
# Enables Video, AnimatedImage, PaleoSession, and the shared media contracts,
# linking the Paleo player with its pure-Rust H.264, HEVC, VP9, and AV1
# backends, plus the GIF decoder.
media = ["dep:image", "dep:paleo-player"]
# Enables AudioPaleoSession and links the cpal audio output backend.
audio = ["media", "paleo-player/device"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["gif"], optional = true }
paleo-player = { version = "0.3", path = "../paleo-player", default-features = false, optional = true }
drawen-core = { version = "0.3", path = "../drawen-core" }
drawen-render = { version = "0.3", path = "../drawen-render" }
drawen-ui = { version = "0.3", path = "../drawen-ui" }
drawen-workspace = { version = "0.3", path = "../drawen-workspace" }
unicode-segmentation = "1.12"

[[test]]
name = "ffmpeg_decoder"
required-features = ["media"]

[[test]]
name = "paleo_session"
required-features = ["media"]

[[test]]
name = "paleo_audio_session"
required-features = ["audio"]
